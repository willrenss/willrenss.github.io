<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halo Angel</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to right, #dcdcdc, #b0b0b0);
        font-family: "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      .container {
        background: #fff0f5;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        width: 90%;
        max-width: 480px;
        text-align: center;
        position: relative;
        z-index: 2;
      }
      h2 {
        margin-bottom: 20px;
        color: #333;
      }
      .question {
        font-size: 1.1rem;
        margin-bottom: 25px;
        color: #444;
      }
      .btn {
        padding: 10px 18px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        background-color: #ffd93d;
        color: #333;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
        position: relative;
      }
      .btn:hover {
        background-color: #ffc300;
      }
      .hidden {
        display: none;
      }
      .heart {
        width: 20px;
        height: 20px;
        position: fixed;
        background: #ff4d6d;
        transform: rotate(45deg);
        animation: float 6s infinite ease-in;
        z-index: 1;
      }
      .heart::before,
      .heart::after {
        content: "";
        width: 20px;
        height: 20px;
        background: #ff4d6d;
        border-radius: 50%;
        position: absolute;
      }
      .heart::before {
        top: -10px;
        left: 0;
      }
      .heart::after {
        left: -10px;
        top: 0;
      }
      @keyframes float {
        0% {
          transform: translateY(100vh) rotate(45deg);
          opacity: 1;
        }
        100% {
          transform: translateY(-10vh) rotate(45deg);
          opacity: 0;
        }
      }
      .audio-control {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 10;
      }
      #noBtn {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Halo Angel</h2>

      <div id="step1" class="step">
        <p class="question">Makanan manis favorit kko apa, hayo?</p>
        <button class="btn" onclick="wrongAnswer()">Cokelat 🍫</button>
        <button class="btn" onclick="wrongAnswer()">Pizza 🍕</button>
        <button class="btn hidden" id="correctBtn" onclick="nextStep(2)">
          Kamu, karena kamu manis banget 🥰
        </button>
      </div>

      <div id="step2" class="step hidden">
        <p class="question">Kapan ulang tahun kko? 🎂</p>
        <button class="btn" onclick="wrongBirthday()">20 Juni 2000</button>
        <button class="btn" onclick="wrongBirthday()">20 Agustus 2000</button>
        <button
          class="btn hidden"
          id="correctBirthdayBtn"
          onclick="nextStep(3)"
        >
          20 Mei 2000 🎉
        </button>
      </div>

      <div id="step3" class="step hidden">
        <p class="question">Pertanyaan terakhir...</p>
        <button class="btn" onclick="nextStep(4)">Ayo!</button>
      </div>

      <div id="step4" class="step hidden">
        <p class="question">
          <strong>Sebenarnya Koko cuma mau nanya:</strong><br /><br />
          Maukah Angel jadi pacar kko? 💛
        </p>
        <button class="btn" onclick="yesAnswer()">Iya</button>
        <button class="btn" id="noBtn" onmouseover="moveButton()">
          Enggak
        </button>
      </div>
    </div>

    <audio id="bgm" loop autoplay class="audio-control">
      <source
        src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_f9d8652417.mp3?filename=romantic-piano-ambient-110184.mp3"
        type="audio/mpeg"
      />
    </audio>

    <script>
      function nextStep(step) {
        document
          .querySelectorAll(".step")
          .forEach((el) => el.classList.add("hidden"));
        document.getElementById("step" + step).classList.remove("hidden");
      }

      function wrongAnswer() {
        alert("Hmm bukan itu... Coba tebak yang paling manis~ 😘");
        document.getElementById("correctBtn").classList.remove("hidden");
      }

      function wrongBirthday() {
        alert("Hehe bukan itu... coba inget lagi ulang tahun kko 🥺");
        document
          .getElementById("correctBirthdayBtn")
          .classList.remove("hidden");
      }

      function yesAnswer() {
        alert("Yay! Yang langgeng ya! 💖");
        createHearts();
        setInterval(createHearts, 500);
      }

      function createHearts() {
        for (let i = 0; i < 5; i++) {
          const heart = document.createElement("div");
          heart.classList.add("heart");
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.animationDuration = Math.random() * 3 + 3 + "s";
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 3000);
        }
      }

      const noBtn = document.getElementById("noBtn");
      document.addEventListener("mousemove", function (e) {
        const rect = noBtn.getBoundingClientRect();
        const offset = 100;
        const dx = e.clientX - (rect.left + rect.width / 2);
        const dy = e.clientY - (rect.top + rect.height / 2);
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < offset) {
          const angle = Math.atan2(dy, dx);
          const moveX = Math.cos(angle) * -150;
          const moveY = Math.sin(angle) * -150;

          const currentLeft = parseFloat(noBtn.style.left || 0);
          const currentTop = parseFloat(noBtn.style.top || 0);

          noBtn.style.left =
            Math.min(
              window.innerWidth - 100,
              Math.max(0, currentLeft + moveX)
            ) + "px";
          noBtn.style.top =
            Math.min(window.innerHeight - 50, Math.max(0, currentTop + moveY)) +
            "px";
        }
      });
    </script>
  </body>
</html>
